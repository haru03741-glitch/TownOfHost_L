name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitInfo が履歴からバージョン情報を作る

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check option key overlaps
        shell: pwsh
        run: ./tools/check-option-keys.ps1

      - name: Check translation keys
        shell: pwsh
        run: ./tools/check-lang-keys.ps1

      - name: Build (Release)
        run: dotnet build TownOfHost.csproj -c Release -o build/

      - name: Upload TownOfHost_L.dll
        uses: actions/upload-artifact@v4
        with:
          name: TownOfHost_L-${{ github.sha }}
          path: build/TownOfHost_L.dll
          retention-days: 30
          if-no-files-found: error

      # 外部から部品を取るので、PR では走らせない
      - name: Package (BepInEx + TownOfHost_L)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/package.ps1 -Dll build/TownOfHost_L.dll -Out build/TownOfHost_L.zip

      - name: Upload TownOfHost_L.zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: TownOfHost_L-package-${{ github.sha }}
          path: build/TownOfHost_L.zip
          retention-days: 30
          if-no-files-found: error
